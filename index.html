              <p style="color:#cbd5e1; font-size:0.85rem; margin-top:10px;">Waiting for other contenders...</p>
              <div id="contender-live-bar" class="contender-status-bar" style="margin-top:14px;"></div>
            </div>
          `;
          this.updateContenderBadgesOnly();
          return;
        }

        document.getElementById('arena-panel').innerHTML = `
          <div class="arena-header"><h2>🧠 Place Cards in Order</h2></div>
          <div class="memory-slots-grid">${st.slots.map((c, i) => `<div class="memory-slot" onclick="game.removeMem(${i})">${c ? c : `#${i+1}`}</div>`).join('')}</div>
          <div class="cards-row" style="margin:10px 0;">${st.unplaced.map((c, i) => `<div class="deck-playing-card interactive" onclick="game.placeMem(${i})">${c}</div>`).join('')}</div>
          <button class="success" style="width:100%;" onclick="game.finishMem()">Submit Arrangement</button>
          <div id="contender-live-bar" class="contender-status-bar"></div>
        `;
        this.updateContenderBadgesOnly();
        this.startTurnTimer(45);
      }
      placeMem(idx) {
        const st = this.miniGameState, empty = st.slots.indexOf(null);
        if (empty !== -1) { st.slots[empty] = st.unplaced.splice(idx, 1)[0]; this.renderMemoryHuntReconstruct(); }
      }
      removeMem(idx) {
        const st = this.miniGameState;
        if (st.slots[idx]) { st.unplaced.push(st.slots[idx]); st.slots[idx] = null; this.renderMemoryHuntReconstruct(); }
      }
      finishMem() {
        const st = this.miniGameState;
        for (let i = 0; i < 10; i++) if (!st.slots[i] && st.unplaced.length) st.slots[i] = st.unplaced.pop();
        let sc = st.slots.filter((c, i) => c === st.target[i]).length;
        const moveData = { sc };
        this.onlineMoves[Number(this.myPlayerId)] = moveData;

        if (this.isOnline && !this.isHost) {
          this.sendMoveToHost(moveData);
          this.renderMemoryHuntReconstruct();
        } else {
          this.updateContenderBadgesOnly();
          if (!this.isOnline) this.resolveMemoryHunt();
          else this.checkAllOnlineMoves();
        }
      }
      resolveMemoryHunt() {
        const scored = this.players.map(p => {
          const move = this.onlineMoves[Number(p.id)];
          let score = (move && move.sc !== undefined && !move.forfeited) ? move.sc : (move && move.forfeited ? 0 : 3 + Math.floor(Math.random() * 6));
          return { id: p.id, sc: score };
        }).sort((a,b) => b.sc - a.sc);

        this.setPendingResults([scored[0].id], [scored[scored.length - 1].id], 1, 1);
      }

      /* =====================================================================
         BOARD & FIGURINE RENDERING
         ===================================================================== */
      renderAll() { this.renderBoard(); this.renderPlayers(); this.renderLogs(); }

      renderBoard() {
        const el = document.getElementById('board-grid');
        el.innerHTML = '';
        for (let i = 0; i <= this.maxPos; i++) {
          const t = document.createElement('div');
          t.className = `tile ${i===0?'start-tile':i===this.maxPos?'goal-tile':this.milestones.includes(i)?'special-milestone':''}`;
          const occ = this.players.filter(p => p.pos === i);
          t.innerHTML = `
            <div class="tile-header"><span>#${i}</span>${this.milestones.includes(i)?'<span class="tile-badge">⭐ CARD</span>':i===0?'START':i===this.maxPos?'GOAL':''}</div>
            <div class="tile-occupants">
              ${occ.map(p => `
                <div class="avatar-token ${Number(p.id)===Number(this.myPlayerId)?'is-human-token':''}" style="border-color:${p.color};">
                  ${Number(p.id)===Number(this.myPlayerId)?'<span class="token-label-you">YOU</span>':''}
                  ${getCharacterAvatarSVG(p.char.id, 24)}
                </div>
              `).join('')}
            </div>
          `;
          el.appendChild(t);
        }
      }

      renderPlayers() {
        document.getElementById('players-list').innerHTML = this.players.map(p => `
          <div class="player-card ${Number(p.id)===Number(this.myPlayerId)?'is-human':''}">
            <div class="player-header">
              <div class="player-info">
                <div class="avatar-frame" style="border-color:${p.color};">${getCharacterAvatarSVG(p.char.id, 38)}</div>
                <div><strong style="color:${p.color}; font-size:0.95rem;">${p.name}</strong><div style="font-size:0.75rem; color:#cbd5e1;">${p.char.name}</div></div>
              </div>
              <span style="font-weight:900; font-size:1.15rem; color:var(--gold);">${p.pos}/${this.maxPos}</span>
            </div>
          </div>
        `).join('');
      }

      renderLogs() {
        document.getElementById('log-content').innerHTML = this.logs.map(l => `
          <div class="log-entry ${l.type}"><span style="color:var(--text-muted); font-size:0.65rem;">[${l.time}]</span> ${l.msg}</div>
        `).join('');
      }

      showWinnerModal(w) {
        document.getElementById('modal-container').innerHTML = `
          <div class="modal-overlay">
            <div class="modal" style="text-align:center;">
              <h1 style="color:var(--gold);">🏆 VICTORY! 🏆</h1>
              <div style="margin:8px auto; width:64px; height:64px;">${getCharacterAvatarSVG(w.char.id, 64)}</div>
              <h2>${w.name} Reached Space ${this.maxPos}!</h2>
              <button class="gold" style="width:100%; margin-top:14px;" onclick="game.resetPrompt()">Play Again</button>
            </div>
          </div>
        `;
      }

      setSetupPlayerCount(c) {
        this.selectedPlayerCount = c;
        ['p4','p6','p8'].forEach(p => document.getElementById(`btn-${p}`)?.classList.toggle('active', c === parseInt(p.slice(1))));
      }
      setSetupBoardLength(l) {
        this.selectedBoardLength = l;
        ['b10','b15','b20'].forEach(b => document.getElementById(`btn-${b}`)?.classList.toggle('active', l === parseInt(b.slice(1))));
      }
    }

    /* INITIALIZATION */
    let game;
    function initGameEngine() {
      if (!game) {
        game = new BoardGameEngine();
        window.game = game;
        game.resetPrompt();
      }
    }
  </script>
</body>
</html>
