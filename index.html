        let html = `
          <div class="arena-header">
            <div>
              <h2>🃏 Joker & Trap: Initial Pick</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">Pick 1 face-down mystery card to form your starting hand!</p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <div style="background:#090e17; padding:14px; border-radius:12px; margin: 8px 0; text-align:center;">
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:10px;">One holds the Joker, one holds the Trap, others are safe:</p>
            <div class="cards-row">
              ${state.mysteryPool.map((c, idx) => `
                <div class="mystery-card" style="width:58px; height:84px; font-size:1.3rem;" onclick="game.jokerTrapChooseInitial(${idx})">
                  🂠
                </div>
              `).join('')}
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      jokerTrapChooseInitial(chosenIdx) {
        const state = this.miniGameState;
        const humanCard = state.mysteryPool.splice(chosenIdx, 1)[0];
        state.hands[this.players[0].id] = [humanCard];

        state.mysteryPool.sort(() => Math.random() - 0.5);
        this.players.filter(p => !p.isHuman).forEach(bot => {
          state.hands[bot.id] = [state.mysteryPool.pop()];
        });

        this.players.forEach(p => {
          for (let k = 0; k < 3; k++) {
            state.hands[p.id].push(state.deckPool.pop());
          }
          state.hands[p.id].sort(() => Math.random() - 0.5);
        });

        this.log(`Picks complete! The table is set with Joker and Trap hidden among players.`, 'win');
        state.phase = 'PASSING_ROUNDS';
        state.roundNumber = 1;
        this.renderJokerTrapPassingRound();
      }

      renderJokerTrapPassingRound() {
        const state = this.miniGameState;
        const n = this.players.length;
        const humanId = this.players[0].id;
        const humanHand = state.hands[humanId];

        // Seating order: Human is at index 0. Neighbor to human's right is index n-1.
        const neighbor = this.players[n - 1];
        const neighborHand = state.hands[neighbor.id];

        let html = `
          <div class="arena-header">
            <div>
              <h2>🃏 The Arena Table: Exchange (${state.roundNumber}/3)</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">
                Watch the radar signs! Draw 1 card from <strong>${neighbor.name}</strong> to your right.
              </p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <!-- 3D POKER ARENA FELT TABLE -->
          <div class="poker-table-wrapper">
            <div class="poker-table-surface">
              
              <!-- Seated Contenders around the table -->
              <div class="table-seats-grid">
                ${this.players.map(p => {
                  const isNeighbor = p.id === neighbor.id;
                  const isYou = p.id === humanId;
                  const pHand = state.hands[p.id];

                  // Detect if Joker or Trap is here
                  const hasJoker = pHand.some(c => c.type === 'JOKER');
                  const hasTrap = pHand.some(c => c.type === 'TRAP');

                  return `
                    <div class="table-seat ${isNeighbor ? 'is-neighbor-draw' : ''}">
                      <!-- RADAR SIGNS -->
                      ${hasJoker ? `<div class="radar-sign joker-sign">👑 JOKER HERE</div>` : ''}
                      ${hasTrap ? `<div class="radar-sign trap-sign">💀 TRAP HERE</div>` : ''}

                      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:2px;">
                        <div style="width:24px; height:24px; border-radius:50%; border:2px solid ${p.color}; overflow:hidden;">
                          ${getCharacterAvatarSVG(p.char.id, 24)}
                        </div>
                        <strong style="font-size:0.8rem; color:${p.color};">${isYou ? 'YOU' : p.name}</strong>
                      </div>

                      <div style="font-size:0.68rem; color:${isNeighbor ? '#38bdf8' : 'var(--text-muted)'}; margin-top:2px;">
                        ${isNeighbor ? '➔ DRAWING FROM' : isYou ? 'Your Seat' : `${pHand.length} Cards`}
                      </div>

                      ${isNeighbor ? `
                        <!-- DRAWABLE CARDS ON THE FELT -->
                        <div class="cards-row" style="margin-top:6px; gap:4px;">
                          ${neighborHand.map((_, idx) => `
                            <div class="mystery-card" style="width:36px; height:52px; font-size:0.9rem;" onclick="game.jokerTrapExecuteDraw(${idx})">
                              🂠
                            </div>
                          `).join('')}
                        </div>
                      ` : `
                        <div style="display:flex; justify-content:center; gap:3px; margin-top:6px; font-size:0.75rem;">
                          ${'🂠 '.repeat(pHand.length)}
                        </div>
                      `}
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Table Center -->
              <div class="table-center-ring">
                <span style="font-size:0.75rem; font-weight:800; color:#34d399; letter-spacing:1px;">ROUND ${state.roundNumber} OF 3</span>
                <p style="font-size:0.8rem; color:#e2e8f0; margin-top:2px;">
                  Tap a card in <strong style="color:#38bdf8;">${neighbor.name}'s</strong> hand to draw it!
                </p>
              </div>

            </div>
          </div>

          <!-- HUMAN'S CURRENT HAND -->
          <div style="background:#090e17; padding:12px; border-radius:12px; border:1px solid #1e293b;">
            <h4 style="margin-bottom:6px; font-size:0.85rem; display:flex; justify-content:space-between;">
              <span>Your Current Hand (4 Cards):</span>
              ${humanHand.some(c => c.type === 'JOKER') ? `<span style="color:var(--gold); font-weight:900;">👑 YOU HOLD JOKER!</span>` : ''}
              ${humanHand.some(c => c.type === 'TRAP') ? `<span style="color:var(--red); font-weight:900;">💀 YOU HOLD TRAP!</span>` : ''}
            </h4>
            <div class="cards-row">
              ${humanHand.map(c => `
                <div class="deck-playing-card ${c.type === 'JOKER' ? 'joker' : c.type === 'TRAP' ? 'trap' : c.isRed ? 'red' : ''}">
                  <div>${c.rank}</div>
                  <div style="font-size:1.4rem; text-align:center;">${c.suit}</div>
                  <div style="text-align:right;">${c.rank}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      jokerTrapExecuteDraw(humanChosenIdx) {
        const state = this.miniGameState;
        const n = this.players.length;
        const chosenCards = {};

        const neighborOfHuman = this.players[n - 1];
        chosenCards[this.players[0].id] = {
          fromId: neighborOfHuman.id,
          cardIdx: humanChosenIdx,
          card: state.hands[neighborOfHuman.id][humanChosenIdx]
        };

        for (let i = 1; i < n; i++) {
          const taker = this.players[i];
          const giver = this.players[i - 1];
          const randomIdx = Math.floor(Math.random() * state.hands[giver.id].length);
          chosenCards[taker.id] = {
            fromId: giver.id,
            cardIdx: randomIdx,
            card: state.hands[giver.id][randomIdx]
          };
        }

        const newHands = {};
        this.players.forEach(p => newHands[p.id] = [...state.hands[p.id]]);

        this.players.forEach(taker => {
          const info = chosenCards[taker.id];
          const giverHand = newHands[info.fromId];
          const removedCard = giverHand.splice(info.cardIdx, 1)[0];
          if (removedCard) newHands[taker.id].push(removedCard);
        });

        state.hands = newHands;
        const receivedCard = chosenCards[this.players[0].id].card;
        this.log(`Drew [${receivedCard.name}] from ${neighborOfHuman.name}!`, receivedCard.type === 'JOKER' ? 'win' : receivedCard.type === 'TRAP' ? 'loss' : 'normal');

        state.roundNumber++;

        if (state.roundNumber <= 3) {
          this.renderJokerTrapPassingRound();
        } else {
          this.renderJokerTrapFinalResults();
        }
      }

      renderJokerTrapFinalResults() {
        const state = this.miniGameState;
        let winners = [];
        let losers = [];

        this.players.forEach(p => {
          const hand = state.hands[p.id];
          if (hand.some(c => c.type === 'JOKER')) winners.push(p.id);
          if (hand.some(c => c.type === 'TRAP')) losers.push(p.id);
        });

        this.setPendingResults(winners, losers, 1, 1);

        let html = `
          <div class="arena-header">
            <h2>🃏 Final Hands Revealed!</h2>
          </div>

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:8px; margin: 10px 0;">
            ${this.players.map(p => {
              const hand = state.hands[p.id];
              const isWin = winners.includes(p.id);
              const isLose = losers.includes(p.id);
              return `
                <div style="background:#090e17; padding:8px; border-radius:8px; border:2px solid ${isWin ? 'var(--green)' : isLose ? 'var(--red)' : '#1e293b'}; font-size:0.8rem;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <strong style="color:${p.color};">${p.name}</strong>
                    <span style="font-weight:bold; color:${isWin ? 'var(--green)' : isLose ? 'var(--red)' : 'var(--text-muted)'}; font-size:0.75rem;">
                      ${isWin ? '🏆 WIN (+1)' : isLose ? '❌ LOSE (-1)' : 'Stays'}
                    </span>
                  </div>
                  <div class="cards-row" style="gap:4px;">
                    ${hand.map(c => `
                      <div class="deck-playing-card ${c.type === 'JOKER' ? 'joker' : c.type === 'TRAP' ? 'trap' : c.isRed ? 'red' : ''}" style="width:46px; height:68px; font-size:0.65rem; padding:3px;">
                        <div>${c.rank}</div>
                        <div style="font-size:1.1rem; text-align:center;">${c.suit}</div>
                        <div style="text-align:right;">${c.rank}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <button class="success" style="width:100%;" onclick="game.applyPendingResults()">Proceed to Board Updates</button>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      /* ===================================================================
         MINI-GAME 6: HIGH CARD: HIDDEN CHOICE
         =================================================================== */
      setupHighCardHidden() {
        const n = this.players.length;
        const totalCards = n * 5;
        const pool = [];
        for (let i = 1; i <= totalCards; i++) {
          pool.push({ id: i, value: i, name: `#${i}` });
        }
        pool.sort(() => Math.random() - 0.5);

        this.miniGameState = {
          type: 'mg6',
          phase: 'PICK_CARDS',
          sharedPool: pool,
          humanPicks: [],
          playerHands: {},
          playedHistory: [],
          scores: {},
          round: 1,
          selectedCardToPlay: null
        };
        this.players.forEach(p => {
          this.miniGameState.scores[p.id] = 0;
          this.miniGameState.playerHands[p.id] = [];
        });

        this.renderHighCardPickPhase();
      }

      renderHighCardPickPhase() {
        const state = this.miniGameState;
        const needed = 5 - state.humanPicks.length;
        let html = `
          <div class="arena-header">
            <div>
              <h2>🂡 High Card: Hidden Choice</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">
                Step 1: Pick <strong>${needed}</strong> more face-down card${needed > 1 ? 's' : ''} for your 5-card secret hand!
              </p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <div style="background:#090e17; padding:12px; border-radius:12px; margin: 8px 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span style="font-size:0.85rem; color:#cbd5e1;">Available Pool (${state.sharedPool.length} Cards)</span>
              <span class="tag gold">${state.humanPicks.length}/5 Picked</span>
            </div>
            <div class="grid-pick" style="grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));">
              ${state.sharedPool.map((c, idx) => `
                <div class="mystery-card" style="aspect-ratio:2/3; font-size:0.9rem;" onclick="game.pickHighCardIndex(${idx})">
                  🂠
                </div>
              `).join('')}
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      pickHighCardIndex(idx) {
        const state = this.miniGameState;
        if (state.humanPicks.length >= 5) return;
        const picked = state.sharedPool.splice(idx, 1)[0];
        state.humanPicks.push(picked);

        if (state.humanPicks.length === 5) {
          state.playerHands[this.players[0].id] = state.humanPicks.sort((a,b) => a.value - b.value);
          this.players.filter(p => !p.isHuman).forEach(bot => {
            const botHand = [];
            for (let k = 0; k < 5; k++) {
              botHand.push(state.sharedPool.pop());
            }
            state.playerHands[bot.id] = botHand.sort((a,b) => a.value - b.value);
          });
          state.phase = 'PLAY_ROUNDS';
          state.round = 1;
          this.log("All players received 5 cards! Round 1 begins.", "win");
          this.renderHighCardPlayRound();
        } else {
          this.renderHighCardPickPhase();
        }
      }

      renderHighCardPlayRound() {
        const state = this.miniGameState;
        const humanId = this.players[0].id;
        const hand = state.playerHands[humanId];

        let html = `
          <div class="arena-header">
            <div>
              <h2>🂡 High Card: Round ${state.round}/5</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">
                Select 1 card to play. Highest = +3 pts, 2nd Highest = +1 pt, Lowest = -1 pt.
              </p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <div style="background:#090e17; padding:12px; border-radius:12px; margin: 8px 0;">
            <h4 style="margin-bottom:8px; font-size:0.9rem;">Your Remaining Hand:</h4>
            <div class="cards-row">
              ${hand.map((c, i) => `
                <div class="deck-playing-card gold-card interactive ${state.selectedCardToPlay === i ? 'selected-play' : ''}" 
                     onclick="game.selectCardToPlay(${i})">
                  <div style="font-size:0.7rem;">CARD</div>
                  <div style="font-size:1.6rem; font-weight:900; text-align:center;">${c.value}</div>
                  <div style="font-size:0.7rem; text-align:right;">★</div>
                </div>
              `).join('')}
            </div>

            <div style="margin-top:14px;">
              <button class="gold" style="width:100%;" ${state.selectedCardToPlay === null ? 'disabled' : ''} onclick="game.confirmPlayHighCard()">
                ▶ Lock In & Play Card #${state.selectedCardToPlay !== null ? hand[state.selectedCardToPlay].value : '?'}
              </button>
            </div>
          </div>

          <div style="background:#090e17; padding:10px; border-radius:10px; font-size:0.8rem;">
            <strong>Current Points Standings:</strong>
            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;">
              ${this.players.map(p => `
                <span style="color:${p.color};">${p.name}: <strong>${state.scores[p.id]} pts</strong></span>
              `).join(' • ')}
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      selectCardToPlay(idx) {
        this.miniGameState.selectedCardToPlay = idx;
        this.renderHighCardPlayRound();
      }

      confirmPlayHighCard() {
        const state = this.miniGameState;
        if (state.selectedCardToPlay === null) return;

        const humanId = this.players[0].id;
        const humanCard = state.playerHands[humanId].splice(state.selectedCardToPlay, 1)[0];
        state.selectedCardToPlay = null;

        const playedThisRound = [];
        playedThisRound.push({ player: this.players[0], card: humanCard });

        // Strategic Bot Decisions
        this.players.filter(p => !p.isHuman).forEach(bot => {
          const bHand = state.playerHands[bot.id];
          let chosenIndex = 0;
          const r = Math.random();
          if (state.round <= 2) {
            chosenIndex = r < 0.6 ? Math.floor(Math.random() * Math.min(2, bHand.length)) : bHand.length - 1;
          } else if (state.round === 3 || state.round === 4) {
            chosenIndex = Math.floor(Math.random() * bHand.length);
          } else {
            chosenIndex = 0;
          }
          if (chosenIndex >= bHand.length) chosenIndex = bHand.length - 1;
          const botCard = bHand.splice(chosenIndex, 1)[0];
          playedThisRound.push({ player: bot, card: botCard });
        });

        // Evaluate Round
        const uniqueValues = [...new Set(playedThisRound.map(x => x.card.value))].sort((a,b) => b - a);
        const highestVal = uniqueValues[0];
        const secondHighestVal = uniqueValues.length > 1 ? uniqueValues[1] : null;
        const lowestVal = uniqueValues[uniqueValues.length - 1];

        const roundScores = {};
        this.players.forEach(p => roundScores[p.id] = 0);

        playedThisRound.forEach(entry => {
          const v = entry.card.value;
          if (v === highestVal) {
            roundScores[entry.player.id] = 3;
          } else if (v === secondHighestVal && v !== lowestVal) {
            roundScores[entry.player.id] = 1;
          } else if (v === lowestVal) {
            roundScores[entry.player.id] = -1;
          } else {
            roundScores[entry.player.id] = 0;
          }
          state.scores[entry.player.id] += roundScores[entry.player.id];
        });

        state.playedHistory.push({
          round: state.round,
          played: playedThisRound,
          roundScores: roundScores
        });

        let html = `
          <div class="arena-header">
            <h2>Round ${state.round} Results</h2>
          </div>

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:8px; margin: 10px 0;">
            ${playedThisRound.map(entry => {
              const pts = roundScores[entry.player.id];
              const sign = pts > 0 ? `+${pts}` : pts;
              return `
                <div style="background:#090e17; padding:8px; border-radius:8px; border:2px solid ${pts > 0 ? 'var(--green)' : pts < 0 ? 'var(--red)' : '#1e293b'}; font-size:0.85rem;">
                  <div style="font-weight:bold; color:${entry.player.color};">${entry.player.name}</div>
                  <div style="font-size:1.1rem; margin: 4px 0;">Card: <strong>${entry.card.value}</strong></div>
                  <div style="font-weight:bold; color:${pts > 0 ? 'var(--green)' : pts < 0 ? 'var(--red)' : 'var(--text-muted)'}; font-size:0.75rem;">
                    ${sign} pts
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div style="margin-top:12px;">
            ${state.round < 5 ? `
              <button class="gold" style="width:100%;" onclick="game.nextHighCardRound()">Continue to Round ${state.round + 1}</button>
            ` : `
              <button class="success" style="width:100%;" onclick="game.finishHighCardGame()">View Final Standings</button>
            `}
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      nextHighCardRound() {
        this.miniGameState.round++;
        this.renderHighCardPlayRound();
      }

      finishHighCardGame() {
        const state = this.miniGameState;
        const standings = this.players.map(p => ({
          player: p,
          total: state.scores[p.id]
        })).sort((a,b) => b.total - a.total);

        const maxTotal = standings[0].total;
        const minTotal = standings[standings.length - 1].total;

        const winners = standings.filter(s => s.total === maxTotal).map(s => s.player.id);
        const losers = standings.filter(s => s.total === minTotal).map(s => s.player.id);

        this.setPendingResults(winners, losers, 1, 1);

        let html = `
          <div class="arena-header">
            <h2>🂡 High Card: Final Standings</h2>
          </div>

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin: 12px 0;">
            ${standings.map(s => `
              <div style="background:#090e17; padding:8px; border-radius:8px; border:2px solid ${winners.includes(s.player.id) ? 'var(--green)' : losers.includes(s.player.id) ? 'var(--red)' : '#1e293b'}; font-size:0.85rem;">
                <div style="font-weight:bold; color:${s.player.color};">${s.player.name}</div>
                <div style="font-size:1.1rem; margin:2px 0;"><strong>${s.total}</strong> pts</div>
                <div style="font-size:0.75rem;">
                  ${winners.includes(s.player.id) ? '🏆 WINNER (+1)' : losers.includes(s.player.id) ? '❌ LOSER (-1)' : 'Stays'}
                </div>
              </div>
            `).join('')}
          </div>

          <button class="success" style="width:100%;" onclick="game.applyPendingResults()">Proceed to Board Updates</button>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      /* ===================================================================
         MINI-GAME 7: GREEDY TREASURE
         =================================================================== */
      setupGreedyTreasure() {
        this.miniGameState = {
          type: 'mg7',
          round: 1,
          cumulativeCoins: {},
          roundHistory: []
        };
        this.players.forEach(p => this.miniGameState.cumulativeCoins[p.id] = 0);
        this.startGreedyTreasureRound();
      }

      startGreedyTreasureRound() {
        const state = this.miniGameState;
        const n = this.players.length;
        const totalTreasure = (n * 16) + Math.floor(Math.random() * 12);
        const budgetPerGroup = Math.floor(totalTreasure / 2);
        const remainder = totalTreasure % 2;

        const shuffled = [...this.players].sort(() => Math.random() - 0.5);
        const half = Math.ceil(n / 2);
        const groupA = shuffled.slice(0, half).map(p => p.id);
        const groupB = shuffled.slice(half).map(p => p.id);

        state.currentRoundData = {
          totalTreasure,
          budgetPerGroup,
          remainder,
          groupA,
          groupB
        };

        this.renderGreedyTreasureInput();
      }

      renderGreedyTreasureInput() {
        const state = this.miniGameState;
        const roundData = state.currentRoundData;
        const budget = roundData.budgetPerGroup;

        let html = `
          <div class="arena-header">
            <div>
              <h2>💰 Greedy Treasure (${state.round}/3)</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">
                Request coins secretly. If your hidden group's total exceeds the budget, everyone gets 0!
              </p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <div style="background:#090e17; padding:16px; border-radius:12px; margin: 8px 0; text-align:center;">
            <div style="font-size:0.85rem; color:#cbd5e1; margin-bottom:4px;">ANNOUNCED TREASURE POOL</div>
            <div style="font-size:2rem; font-weight:900; color:var(--gold);">💎 ${roundData.totalTreasure} Coins</div>
            <p style="color:var(--text-muted); font-size:0.8rem; margin-top:4px;">
              Each hidden group has a budget of <strong>${budget} coins</strong>.
              ${roundData.remainder > 0 ? `(${roundData.remainder} coin locked in vault)` : ''}
            </p>

            <div style="margin: 20px 0 10px 0; text-align:left;">
              <label style="font-size:0.9rem; font-weight:700;">How many coins do you request? (0 – ${budget}):</label>
              <div style="display:flex; gap:8px; margin-top:8px;">
                <input type="number" id="treasure-bid-input" min="0" max="${budget}" value="${Math.floor(budget / 3)}" 
                       style="background:#1e293b; border:2px solid var(--border); border-radius:8px; padding:10px; color:white; font-size:1.2rem; width:100px; text-align:center;" />
                <button class="gold" style="flex:1;" onclick="game.submitGreedyBid()">Lock In Request</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      submitGreedyBid() {
        const state = this.miniGameState;
        const roundData = state.currentRoundData;
        const budget = roundData.budgetPerGroup;
        const inputEl = document.getElementById('treasure-bid-input');
        let humanBid = parseInt(inputEl.value) || 0;
        humanBid = Math.max(0, Math.min(budget, humanBid));

        const bids = {};
        bids[this.players[0].id] = humanBid;

        this.players.filter(p => !p.isHuman).forEach(bot => {
          const estimatedGroupSize = Math.max(2, Math.round(this.players.length / 2));
          const fairShare = Math.floor(budget / estimatedGroupSize);
          const greedFactor = 0.7 + (Math.random() * 0.65);
          const bid = Math.min(budget, Math.max(1, Math.round(fairShare * greedFactor)));
          bids[bot.id] = bid;
        });

        let sumA = 0;
        roundData.groupA.forEach(id => sumA += bids[id]);
        const successA = sumA <= budget;

        let sumB = 0;
        roundData.groupB.forEach(id => sumB += bids[id]);
        const successB = sumB <= budget;

        const roundEarnings = {};
        this.players.forEach(p => {
          const inA = roundData.groupA.includes(p.id);
          const success = inA ? successA : successB;
          const earned = success ? bids[p.id] : 0;
          roundEarnings[p.id] = earned;
          state.cumulativeCoins[p.id] += earned;
        });

        state.roundHistory.push({
          round: state.round,
          roundData,
          bids,
          sumA,
          sumB,
          successA,
          successB,
          roundEarnings
        });

        let html = `
          <div class="arena-header">
            <h2>💰 Round ${state.round} Treasure Results</h2>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin: 8px 0;">
            <div style="background:#090e17; padding:10px; border-radius:10px; border:2px solid ${successA ? 'var(--green)' : 'var(--red)'}; text-align:center;">
              <h4 style="color:#e2e8f0; font-size:0.9rem;">Group A</h4>
              <div style="font-size:1.1rem; font-weight:800; margin:2px 0;">${sumA} / ${budget}</div>

            <div style="background:#090e17; padding:10px; border-radius:10px; border:2px solid ${successB ? 'var(--green)' : 'var(--red)'}; text-align:center;">
              <h4 style="color:#e2e8f0; font-size:0.9rem;">Group B</h4>
              <div style="font-size:1.1rem; font-weight:800; margin:2px 0;">${sumB} / ${budget}</div>
              <span class="tag ${successB ? 'green' : 'red'}">${successB ? '✅ SAFE (Paid Out)' : '❌ BUSTED (0 Paid)'}</span>
            </div>
          </div>

          <h4 style="margin-top:8px; font-size:0.85rem; color:var(--text-muted);">Player Earnings & Standings:</h4>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:6px; margin-bottom:12px;">
            ${this.players.map(p => {
              const earned = roundEarnings[p.id];
              return `
                <div style="background:#090e17; padding:6px 8px; border-radius:8px; border:1px solid #1e293b; font-size:0.8rem;">
                  <strong style="color:${p.color};">${p.name}</strong>
                  <div>Requested: ${bids[p.id]} 🪙</div>
                  <div style="color:${earned > 0 ? 'var(--green)' : 'var(--red)'}; font-weight:bold;">
                    Earned: +${earned}
                  </div>
                  <div style="font-size:0.75rem; color:var(--gold); margin-top:2px;">Total: ${state.cumulativeCoins[p.id]} 🪙</div>

          </div>

          <div style="margin-top:10px;">
            ${state.round < 3 ? `
              <button class="gold" style="width:100%;" onclick="game.nextGreedyRound()">Next Round (${state.round + 1}/3)</button>

              <button class="success" style="width:100%;" onclick="game.finishGreedyGame()">View Final Results</button>
            `}
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      nextGreedyRound() {
        this.miniGameState.round++;
        this.startGreedyTreasureRound();
      }

      finishGreedyGame() {
        const state = this.miniGameState;
        const sorted = this.players.map(p => ({
          player: p,
          total: state.cumulativeCoins[p.id]
        })).sort((a,b) => b.total - a.total);

        const maxTotal = sorted[0].total;
        const minTotal = sorted[sorted.length - 1].total;

        const winners = sorted.filter(s => s.total === maxTotal).map(s => s.player.id);
        const losers = sorted.filter(s => s.total === minTotal).map(s => s.player.id);

        this.setPendingResults(winners, losers, 1, 1);

        let html = `
          <div class="arena-header">
            <h2>💰 Final Treasure Standings</h2>
          </div>

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin: 12px 0;">
            ${sorted.map(s => `
              <div style="background:#090e17; padding:8px; border-radius:8px; border:2px solid ${winners.includes(s.player.id) ? 'var(--green)' : losers.includes(s.player.id) ? 'var(--red)' : '#1e293b'}; font-size:0.85rem;">
                <div style="font-weight:bold; color:${s.player.color};">${s.player.name}</div>
                <div style="font-size:1.15rem; color:var(--gold); margin:2px 0;"><strong>${s.total}</strong> 🪙</div>
                <div style="font-size:0.75rem;">
                  ${winners.includes(s.player.id) ? '🏆 WINNER (+1)' : losers.includes(s.player.id) ? '❌ LOSER (-1)' : 'Stays'}
                </div>
              </div>
            `).join('')}
          </div>

          <button class="success" style="width:100%;" onclick="game.applyPendingResults()">Proceed to Board Updates</button>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      /* ===================================================================
         MINI-GAME 8: MEMORY HUNT (10 CARDS)
         =================================================================== */
      setupMemoryHunt() {
        const deck10 = [
          { id: 1, rank: 'A', suit: '♠', isRed: false },
          { id: 2, rank: 'K', suit: '♥', isRed: true },
          { id: 3, rank: 'Q', suit: '♦', isRed: true },
          { id: 4, rank: 'J', suit: '♣', isRed: false },
          { id: 5, rank: '10', suit: '♠', isRed: false },
          { id: 6, rank: '9', suit: '♥', isRed: true },
          { id: 7, rank: '8', suit: '♦', isRed: true },
          { id: 8, rank: '7', suit: '♣', isRed: false },
          { id: 9, rank: '6', suit: '♠', isRed: false },
          { id: 10, rank: '5', suit: '♥', isRed: true }
        ];
        const targetOrder = [...deck10].sort(() => Math.random() - 0.5);

        this.miniGameState = {
          type: 'mg8',
          phase: 'MEMORIZE',
          targetOrder: targetOrder,
          humanSlots: new Array(10).fill(null),
          unplacedCards: [...deck10].sort(() => Math.random() - 0.5),
          countdown: 5,
          decisionTimer: 30
        };

        this.renderMemoryHuntMemorize();
      }

      renderMemoryHuntMemorize() {
        const state = this.miniGameState;
        let html = `
          <div class="arena-header">
            <div>
              <h2>🧠 Memory Hunt: Memorize!</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">Memorize the exact order of all 10 cards!</p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <div style="background:#090e17; padding:12px; border-radius:12px; margin: 8px 0; text-align:center;">
            <div style="font-size:1.6rem; font-weight:bold; color:var(--gold); margin-bottom:10px;">
              ⏳ Memorize Time: <span id="mem-count">${state.countdown}</span>s
            </div>

            <div class="memory-slots-grid">
              ${state.targetOrder.map((c, i) => `
                <div class="deck-playing-card ${c.isRed ? 'red' : ''}" style="width:auto; height:74px;">
                  <div style="font-size:0.6rem; color:var(--text-muted); font-weight:normal;">#${i + 1}</div>
                  <div style="font-size:1.1rem; text-align:center;">${c.rank} ${c.suit}</div>
                  <div style="font-size:0.6rem; text-align:right;">#${i + 1}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;

        const interval = setInterval(() => {
          state.countdown--;
          const el = document.getElementById('mem-count');
          if (el) el.innerText = state.countdown;

          if (state.countdown <= 0) {
            clearInterval(interval);
            state.phase = 'RECONSTRUCT';
            this.startMemoryHuntReconstruct();
          }
        }, 1000);
        this.addTimer(interval);
      }

      startMemoryHuntReconstruct() {
        const state = this.miniGameState;
        this.renderMemoryHuntReconstruct();

        const decisionInterval = setInterval(() => {
          state.decisionTimer--;
          const timerEl = document.getElementById('decision-timer');
          if (timerEl) timerEl.innerText = state.decisionTimer;

          if (state.decisionTimer <= 0) {
            clearInterval(decisionInterval);
            this.submitMemoryHuntArrangement();
          }
        }, 1000);
        this.addTimer(decisionInterval);
      }

      renderMemoryHuntReconstruct() {
        const state = this.miniGameState;

        let html = `
          <div class="arena-header">
            <div>
              <h2>🧠 Reconstruct Arrangement</h2>
              <p style="color:var(--text-muted); font-size:0.8rem;">
                Time remaining: <strong id="decision-timer" style="color:var(--gold); font-size:1rem;">${state.decisionTimer}</strong>s
              </p>
            </div>
            ${this.getInGameAbilityBar()}
          </div>

          <div style="background:#090e17; padding:12px; border-radius:12px; margin: 8px 0;">
            <h4 style="font-size:0.85rem; color:#cbd5e1; margin-bottom:6px;">Target Slots (Tap placed card to remove):</h4>
            <div class="memory-slots-grid">
              ${state.humanSlots.map((card, idx) => `
                <div class="memory-slot ${card ? 'filled' : ''}" onclick="game.removeMemorySlotCard(${idx})">
                  ${card ? `
                    <div class="deck-playing-card ${card.isRed ? 'red' : ''}" style="width:100%; height:100%;">
                      <div style="font-size:0.6rem;">#${idx + 1}</div>
                      <div style="font-size:1.1rem; text-align:center;">${card.rank} ${card.suit}</div>
                      <div style="font-size:0.6rem; text-align:right;">#${idx + 1}</div>
                    </div>
                  ` : `
                    <span style="color:#64748b; font-size:0.85rem; font-weight:bold;">#${idx + 1}</span>
                  `}
                </div>
              `).join('')}
            </div>

            <h4 style="font-size:0.85rem; color:#cbd5e1; margin:10px 0 6px 0;">Available Cards (Tap to place into next open slot):</h4>
            <div class="cards-row" style="min-height:76px;">
              ${state.unplacedCards.map((card, idx) => `
                <div class="deck-playing-card ${card.isRed ? 'red' : ''} interactive" style="width:48px; height:70px;" 
                     onclick="game.placeMemoryCard(${idx})">
                  <div>${card.rank}</div>
                  <div style="font-size:1.1rem; text-align:center;">${card.suit}</div>
                  <div style="text-align:right;">${card.rank}</div>
                </div>
              `).join('')}
            </div>

            <div style="display:flex; gap:8px; margin-top:14px;">
              <button class="secondary" style="flex:1;" onclick="game.clearAllMemorySlots()">Clear Slots</button>
              <button class="success" style="flex:1;" onclick="game.submitMemoryHuntArrangement()">Submit Arrangement</button>
            </div>
          </div>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      placeMemoryCard(unplacedIdx) {
        const state = this.miniGameState;
        const emptySlotIdx = state.humanSlots.findIndex(s => s === null);
        if (emptySlotIdx === -1) return;

        const card = state.unplacedCards.splice(unplacedIdx, 1)[0];
        state.humanSlots[emptySlotIdx] = card;
        this.renderMemoryHuntReconstruct();
      }

      removeMemorySlotCard(slotIdx) {
        const state = this.miniGameState;
        if (!state.humanSlots[slotIdx]) return;
        const card = state.humanSlots[slotIdx];
        state.humanSlots[slotIdx] = null;
        state.unplacedCards.push(card);
        this.renderMemoryHuntReconstruct();
      }

      clearAllMemorySlots() {
        const state = this.miniGameState;
        state.humanSlots.forEach(card => {
          if (card) state.unplacedCards.push(card);
        });
        state.humanSlots = new Array(10).fill(null);
        this.renderMemoryHuntReconstruct();
      }

      submitMemoryHuntArrangement() {
        this.clearActiveTimers();
        const state = this.miniGameState;

        for (let i = 0; i < 10; i++) {
          if (state.humanSlots[i] === null && state.unplacedCards.length > 0) {
            state.humanSlots[i] = state.unplacedCards.pop();
          }
        }

        let humanScore = 0;
        state.humanSlots.forEach((c, idx) => {
          if (c && c.id === state.targetOrder[idx].id) humanScore++;
        });

        const playerScores = {};
        playerScores[this.players[0].id] = humanScore;

        this.players.filter(p => !p.isHuman).forEach(bot => {
          const memoryAccuracy = 3 + Math.floor(Math.random() * 6);
          playerScores[bot.id] = memoryAccuracy;
        });

        const sorted = this.players.map(p => ({
          player: p,
          score: playerScores[p.id]
        })).sort((a,b) => b.score - a.score);

        const maxScore = sorted[0].score;
        const minScore = sorted[sorted.length - 1].score;

        const winners = sorted.filter(s => s.score === maxScore).map(s => s.player.id);
        const losers = sorted.filter(s => s.score === minScore).map(s => s.player.id);

        this.setPendingResults(winners, losers, 1, 1);

        let html = `
          <div class="arena-header">
            <h2>🧠 Memory Hunt: Results</h2>
          </div>

          <div style="background:#090e17; padding:12px; border-radius:12px; margin: 8px 0;">
            <h4 style="margin-bottom:6px; font-size:0.9rem;">Your Reconstructed Arrangement (Score: <span style="color:var(--gold); font-size:1.25rem;">${humanScore}/10</span>):</h4>
            <div class="memory-slots-grid">
              ${state.humanSlots.map((c, idx) => {
                const isCorrect = c && c.id === state.targetOrder[idx].id;
                return `
                  <div class="memory-slot ${isCorrect ? 'correct' : 'wrong'}">
                    <div class="deck-playing-card ${c.isRed ? 'red' : ''}" style="width:100%; height:100%;">
                      <div style="font-size:0.6rem; display:flex; justify-content:space-between;">
                        <span>#${idx + 1}</span>
                        <span style="font-weight:900;">${isCorrect ? '✓' : '✗'}</span>
                      </div>
                      <div style="font-size:1.1rem; text-align:center;">${c.rank} ${c.suit}</div>
                      <div style="font-size:0.6rem; text-align:right;">#${idx + 1}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <h4 style="margin-top:8px; font-size:0.85rem; color:var(--text-muted);">Scores & Movement:</h4>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:6px; margin: 8px 0 12px 0;">
            ${sorted.map(s => `
              <div style="background:#090e17; padding:8px; border-radius:8px; border:2px solid ${winners.includes(s.player.id) ? 'var(--green)' : losers.includes(s.player.id) ? 'var(--red)' : '#1e293b'}; font-size:0.85rem;">
                <div style="font-weight:bold; color:${s.player.color};">${s.player.name}</div>
                <div>Score: <strong>${s.score}/10</strong></div>
                <div style="font-size:0.75rem;">
                  ${winners.includes(s.player.id) ? '🏆 WINNER (+1)' : losers.includes(s.player.id) ? '❌ LOSER (-1)' : 'Stays'}
                </div>
              </div>
            `).join('')}
          </div>

          <button class="success" style="width:100%;" onclick="game.applyPendingResults()">Proceed to Board Updates</button>
        `;
        document.getElementById('arena-panel').innerHTML = html;
      }

      /* ===================================================================
         MODALS & INTERFACES
         ===================================================================== */
      promptLuckyOneChoice(player, c1, c2, stolenCardItems = null) {
        const modal = document.getElementById('modal-container');
        modal.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <h2>🍀 The Lucky One: Choose 1</h2>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
                <div class="card-presentation ${c1.tier}" onclick="game.finishLuckyOne('${c1.id}', '${c2.id}', ${JSON.stringify(stolenCardItems || []).replace(/"/g, '&quot;')})">
                  ${getSpecialCardArtSVG(c1.id, 46)}
                  <h4 style="margin:4px 0; font-size:0.95rem;">${c1.name}</h4>
                  <span class="tag gold">${c1.tier}</span>
                  <p style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">${c1.desc}</p>
                  <button class="gold" style="margin-top:8px; width:100%; min-height:36px;">Select</button>
                </div>
                <div class="card-presentation ${c2.tier}" onclick="game.finishLuckyOne('${c2.id}', '${c1.id}', ${JSON.stringify(stolenCardItems || []).replace(/"/g, '&quot;')})">
                  ${getSpecialCardArtSVG(c2.id, 46)}
                  <h4 style="margin:4px 0; font-size:0.95rem;">${c2.name}</h4>
                  <span class="tag gold">${c2.tier}</span>
                  <p style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">${c2.desc}</p>
                  <button class="gold" style="margin-top:8px; width:100%; min-height:36px;">Select</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      finishLuckyOne(chosenId, discardedId, stolenCardItems) {
        document.getElementById('modal-container').innerHTML = '';
        const chosen = CARD_TEMPLATES.find(c => c.id === chosenId);
        const discarded = CARD_TEMPLATES.find(c => c.id === discardedId);
        if (discarded) this.returnCardToBottom(discarded);
        if (chosen) this.giveCardToPlayer(this.players[0], chosen, false);

        if (stolenCardItems && stolenCardItems.length > 0) {
          stolenCardItems.forEach(item => {
            this.giveCardToPlayer(this.players[0], item.card, false);
          });
          this.showThiefDoubleCardRewardModal(chosen, stolenCardItems);
        } else {
          this.showCardDrawnPresentationModal(chosen);
        }
      }

      promptMagicianChoice(player, card) {
        const modal = document.getElementById('modal-container');
        modal.innerHTML = `
          <div class="modal-overlay">
            <div class="modal" style="text-align:center;">
              <h2>🎩 Magician Swap</h2>
              <div class="card-presentation ${card.tier}">
                ${getSpecialCardArtSVG(card.id, 55)}
                <h3>${card.name}</h3>
                <span class="tag gold">${card.tier}</span>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">${card.desc}</p>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="success" style="flex:1;" onclick="game.finishMagician(false, '${card.id}')">Keep Card</button>
                <button class="gold" style="flex:1;" onclick="game.finishMagician(true, '${card.id}')">Swap Random</button>
              </div>
            </div>
          </div>
        `;
      }

      finishMagician(replace, originalId) {
        document.getElementById('modal-container').innerHTML = '';
        const original = CARD_TEMPLATES.find(c => c.id === originalId);
        if (replace && original) {
          this.returnCardToBottom(original);
          const replaced = this.drawCardFromDeck();
          this.log(`Swapped ${original.name} for ${replaced.name}!`, 'effect');
          this.giveCardToPlayer(this.players[0], replaced);
        } else if (original) {
          this.giveCardToPlayer(this.players[0], original);
        }
      }

        const others = this.players.filter(p => p.id !== player.id);

            <div class="modal">

                ${others.map(o => `

                      <strong style="color:${o.color}">${o.name}</strong> (${o.char.name}) — Space ${o.pos}/${this.maxPos}
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        this.pendingTargetCallback = callback;

              <h1 style="color:var(--gold); font-size:2.2rem; margin-bottom:4px;">🏆 VICTORY! 🏆</h1>

        this.selectedBoardLength = len;
        document.getElementById('btn-b10').classList.toggle('active', len === 10);
        document.getElementById('btn-b15').classList.toggle('active', len === 15);
        document.getElementById('btn-b20').classList.toggle('active', len === 20);
      }

      confirmStartNewGame() {
        this.startNewGame(this.selectedPlayerCount, this.selectedBoardLength);
      }

      /* ===================================================================
         RENDERING: DELUXE FIGURINES & BOARD
         ===================================================================== */
      renderAll() {
        this.renderBoard();
        this.renderPlayers();
        this.renderLogs();
      }

      renderBoard() {
        const boardEl = document.getElementById('board-grid');
        boardEl.innerHTML = '';

        for (let i = 0; i <= this.maxPos; i++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          if (i === 0) tile.classList.add('start-tile');
          if (i === this.maxPos) tile.classList.add('goal-tile');
          if (this.milestones.includes(i)) tile.classList.add('special-milestone');

          const occupants = this.players.filter(p => p.pos === i);

          tile.innerHTML = `
            <div class="tile-header">
              <span>#${i}</span>
              ${this.milestones.includes(i) ? '<span class="tile-badge">⭐ CARD</span>' : i === 0 ? '<span>START</span>' : i === this.maxPos ? '<span>GOAL</span>' : ''}
            </div>
            <div class="tile-occupants">
              ${occupants.map(p => `
                <div class="avatar-token ${p.isHuman ? 'is-human-token' : ''}" 
                     style="border-color:${p.color};" 
                     title="${p.name} (${p.char.name})">
                  ${p.isHuman ? '<span class="token-label-you">YOU</span>' : ''}
                  ${getCharacterAvatarSVG(p.char.id, 24)}
                </div>
              `).join('')}
            </div>
          `;
          boardEl.appendChild(tile);
        }
      }

      renderPlayers() {
        const list = document.getElementById('players-list');
        list.innerHTML = this.players.map(p => `
          <div class="player-card ${p.isHuman ? 'is-human' : ''}">
            <div class="player-header">
              <div class="player-info">
                <div class="avatar-frame" style="border-color:${p.color};">
                  ${getCharacterAvatarSVG(p.char.id, 40)}
                </div>
                <div>
                  <strong style="color:${p.color}; font-size:0.95rem;">${p.name}</strong>
                  <div style="font-size:0.75rem; color:#cbd5e1; font-weight:600;">${p.char.name}</div>
                </div>
              </div>
              <span style="font-weight:900; font-size:1.15rem; color:var(--gold);">${p.pos}/${this.maxPos}</span>
            </div>
            <div style="font-size:0.72rem; color:var(--text-muted); line-height:1.35;">
              ${p.char.desc}
            </div>
            <div class="status-tags">
              <span class="tag ${p.charUsed ? '' : 'purple'}">${p.charUsed ? 'Used' : 'Ability Ready'}</span>
              ${p.hasShield ? '<span class="tag green">🛡️ Shield</span>' : ''}
              ${p.hasComeback ? '<span class="tag green">Comeback</span>' : ''}
              ${p.doubleRewardActive ? '<span class="tag gold">2x Win</span>' : ''}
              ${p.hasExtraChance ? '<span class="tag gold">⭐ Extra Chance</span>' : ''}
            </div>
          </div>
        `).join('');
      }

      renderLogs() {
        const logContent = document.getElementById('log-content');
        logContent.innerHTML = this.logs.map(l => `
          <div class="log-entry ${l.type}">
            <span style="color:var(--text-muted); font-size:0.65rem;">[${l.time}]</span> ${l.msg}
          </div>
        `).join('');
      }

      openStrategistSelector() {
        const modal = document.getElementById('modal-container');
        modal.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <h2>🧠 Choose Next Mini-Game</h2>
              <div style="display:flex; flex-direction:column; gap:6px; margin: 10px 0;">
                ${MINI_GAMES.map(mg => `
                  <button style="padding:10px; text-align:left; justify-content:flex-start;" onclick="game.selectStrategistGame('${mg.id}')">
                    ${mg.name}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      selectStrategistGame(mgId) {
        document.getElementById('modal-container').innerHTML = '';
        const human = this.players[0];
        human.charUsed = true;
        this.strategistChoice = MINI_GAMES.find(g => g.id === mgId);
        this.log(`You chose ${this.strategistChoice.name} for Round ${this.round}!`, 'win');
        this.showRoundTransitionScreen();
      }

      activateHumanThief() {
        const human = this.players[0];
        this.promptTargetPlayer(human, (targetId) => {
          human.charUsed = true;
          const target = this.players.find(p => p.id === targetId);
          if (target) {
            target.reservedTheftBy = human.id;
            this.log(`You secretly placed a theft trap on ${target.name}!`, 'win');
          }
          this.showRoundTransitionScreen();
        });
      }

      activateHumanGambler() {
        const human = this.players[0];
        human.charUsed = true;
        human.activeCharOption = 'WAGER';
        this.log("You placed a wager! Win = +2 spaces, Lose = -2 spaces.", "gold");
        this.renderPlayers();
        const abilityBtn = document.querySelector('.arena-header button.gold');
        if (abilityBtn) abilityBtn.remove();
      }

      activateHumanCharmer() {
        const human = this.players[0];
        this.promptTargetPlayer(human, (targetId) => {
          human.charUsed = true;
          human.activeCharOption = targetId;
          const target = this.players.find(p => p.id === targetId);
          if (target) {
            this.log(`You secretly charmed ${target.name}. If they win and you don't, you gain +1 space!`, 'win');
          }
          this.renderPlayers();
          const abilityBtn = document.querySelector('.arena-header button.secondary');
          if (abilityBtn) abilityBtn.remove();
        });
      }
    }

    /* ENGINE INITIALIZATION */
    let game;
    function initGameEngine() {
      if (!game) {
        game = new BoardGameEngine();
        window.game = game;

        if (!game.loadState()) {
          game.resetPrompt();
        } else {
          game.renderAll();
          if (game.status === 'MINIGAME' && game.currentMiniGame) {
            game.launchMiniGame(game.currentMiniGame.id);
          } else {
            game.showRoundTransitionScreen();
          }
        }
      }
    }
  </script>
</body>
</html>
